name: 发布npm包

on:
  push:
    tags:
      - "v*"

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    # OIDC 可信发布：无需 NPM_TOKEN，通过临时身份令牌向 npm 认证
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # 防止 tag 打错：必须与 package.json 的 version 一致才允许发布
      - name: 校验 tag 与 package.json 版本一致
        run: |
          node -e "
            const pkg = require('./package.json');
            if ('v' + pkg.version !== process.env.GITHUB_REF_NAME) {
              console.error('tag ' + process.env.GITHUB_REF_NAME + ' 与 package.json 版本 v' + pkg.version + ' 不一致');
              process.exit(1);
            }
          "
      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      # node 24 自带的 npm >= 11.5.1，已支持 OIDC 可信发布
      - run: pnpm i
      - run: pnpm build
      - run: npm publish --provenance
